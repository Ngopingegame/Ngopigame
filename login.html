<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOGIN OWNER - NGOPINGEGAME</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#050816;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.login-box{
    width:100%;
    max-width:400px;
    background:#0f172a;
    padding:35px;
    border-radius:20px;
    border:1px solid rgba(0,255,204,0.2);
    box-shadow:0 0 20px rgba(0,255,204,0.1);
}

.logo{
    text-align:center;
    font-size:30px;
    color:#00ffcc;
    font-weight:bold;
    margin-bottom:10px;
    text-shadow:0 0 10px #00ffcc;
}

.sub{
    text-align:center;
    color:#94a3b8;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#cbd5e1;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#1e293b;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#00ffcc;
    color:black;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.status{
    margin-top:15px;
    text-align:center;
    color:#ef4444;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#00ffcc;
    opacity:0.7;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
}

</style>
</head>
<body>

<div class="login-box">

    <div class="logo">
        OWNER LOGIN
    </div>

    <div class="sub">
        NGOPINGEGAME
    </div>

    <div class="input-group">
        <label>Email Owner</label>
        <input type="email" id="email" placeholder="Masukkan email">
    </div>

    <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Masukkan password">
    </div>

    <button onclick="login()">
        LOGIN
    </button>

    <div class="status" id="status"></div>

    <div class="footer">
        by asyraf
    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDtxgmyjXf-JTjpDNku_LZwO4GXniLvSVE",
  authDomain: "ngopingegame-3e92c.firebaseapp.com",
  databaseURL: "https://ngopingegame-3e92c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ngopingegame-3e92c",
  storageBucket: "ngopingegame-3e92c.firebasestorage.app",
  messagingSenderId: "810064465459",
  appId: "1:810064465459:web:b8564ed2898f41d24e5d46",
  measurementId: "G-Y8PSYJDYD4"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.login = function(){

    let email = document.getElementById('email').value;

    let password = document.getElementById('password').value;

    signInWithEmailAndPassword(auth, email, password)

    .then((userCredential) => {

        document.getElementById('status').innerHTML =
        'Login berhasil';

        window.location.href = "owner.html";

    })

    .catch((error) => {

        document.getElementById('status').innerHTML =
        'Email atau password salah';

    });

}

</script>

</body>
</html>
