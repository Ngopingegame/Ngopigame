<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OWNER DASHBOARD - NGOPINGEGAME</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#050816;
    color:white;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.header{
    background:#0f172a;
    padding:20px;
    border-radius:20px;
    margin-bottom:25px;
    border:1px solid rgba(0,255,204,0.2);
    box-shadow:0 0 20px rgba(0,255,204,0.1);
    text-align:center;
}

.logo{
    font-size:32px;
    color:#00ffcc;
    font-weight:bold;
    text-shadow:0 0 10px #00ffcc;
}

.sub{
    margin-top:10px;
    color:#94a3b8;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:#0f172a;
    padding:25px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 0 15px rgba(0,255,204,0.08);
}

.card-title{
    color:#00ffcc;
    margin-bottom:15px;
    font-size:20px;
}

.big-number{
    font-size:35px;
    font-weight:bold;
    color:white;
}

.table-card{
    background:#0f172a;
    padding:20px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 0 15px rgba(0,255,204,0.08);
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th{
    background:#00ffcc;
    color:black;
    padding:14px;
    text-align:left;
}

table td{
    padding:14px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.footer{
    text-align:center;
    margin-top:40px;
    color:#00ffcc;
    opacity:0.7;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
}

@media(max-width:900px){

    .grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="logo">OWNER DASHBOARD</div>
        <div class="sub">NGOPINGEGAME</div>
    </div>

    <div class="grid">

        <div class="card">
            <div class="card-title">Total Transaksi</div>
            <div class="big-number" id="totalTransaksi">0</div>
        </div>

        <div class="card">
            <div class="card-title">Total Pendapatan</div>
            <div class="big-number" id="totalPendapatan">
                Rp 0
            </div>
        </div>

    </div>

    <div class="table-card">

        <div class="card-title">
            Riwayat Transaksi
        </div>

        <table>

            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Jam</th>
                    <th>Total</th>
                    <th>Waktu</th>
                </tr>
            </thead>

            <tbody id="dataTransaksi">

            </tbody>

        </table>

    </div>

    <div class="footer">
        by asyraf
    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDtxgmyjXf-JTjpDNku_LZwO4GXniLvSVE",
  authDomain: "ngopingegame-3e92c.firebaseapp.com",
  databaseURL: "https://ngopingegame-3e92c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ngopingegame-3e92c",
  storageBucket: "ngopingegame-3e92c.firebasestorage.app",
  messagingSenderId: "810064465459",
  appId: "1:810064465459:web:b8564ed2898f41d24e5d46",
  measurementId: "G-Y8PSYJDYD4"
};

const app = initializeApp(firebaseConfig);

const database = getDatabase(app);

const transaksiRef = ref(database, 'transaksi');

onValue(transaksiRef, (snapshot) => {

    let data = snapshot.val();

    let tabel = '';

    let jumlah = 0;

    let pendapatan = 0;

    for(let id in data){

        jumlah++;

        pendapatan += data[id].total;

        tabel += `
            <tr>
                <td>${data[id].nama}</td>
                <td>${data[id].jam} Jam</td>
                <td>Rp ${data[id].total.toLocaleString('id-ID')}</td>
                <td>${data[id].waktu}</td>
            </tr>
        `;
    }

    document.getElementById('dataTransaksi').innerHTML = tabel;

    document.getElementById('totalTransaksi').innerHTML =
    jumlah;

    document.getElementById('totalPendapatan').innerHTML =
    'Rp ' + pendapatan.toLocaleString('id-ID');

});

</script>

</body>
</html>
