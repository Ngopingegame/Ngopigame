<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OWNER DASHBOARD - NGOPINGEGAME</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#050816;
    color:white;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.header{
    background:#0f172a;
    padding:20px;
    border-radius:20px;
    margin-bottom:25px;
    border:1px solid rgba(0,255,204,0.2);
    box-shadow:0 0 20px rgba(0,255,204,0.1);
    text-align:center;
}

.logo{
    font-size:32px;
    color:#00ffcc;
    font-weight:bold;
    text-shadow:0 0 10px #00ffcc;
}

.sub{
    margin-top:10px;
    color:#94a3b8;
}

.logout-btn{
    background:#00ffcc;
    color:black;
    border:none;
    padding:12px 20px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:#0f172a;
    padding:25px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 0 15px rgba(0,255,204,0.08);
}

.card-title{
    color:#00ffcc;
    margin-bottom:15px;
    font-size:20px;
}

.big-number{
    font-size:35px;
    font-weight:bold;
    color:white;
}

.table-card{
    background:#0f172a;
    padding:20px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 0 15px rgba(0,255,204,0.08);
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th{
    background:#00ffcc;
    color:black;
    padding:14px;
    text-align:left;
}

table td{
    padding:14px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.footer{
    text-align:center;
    margin-top:40px;
    color:#00ffcc;
    opacity:0.7;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
}

.reset-btn{
    margin-top:20px;
    background:#ef4444;
    color:white;
    border:none;
    padding:14px 20px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    width:100%;
}

@media(max-width:900px){

    .grid{
        grid-template-columns:1fr;
    }

}

    .ps-box{
    background:#111827;
    padding:20px;
    border-radius:16px;
    margin-bottom:15px;
    border:1px solid rgba(0,255,204,0.2);
}

.ps-title{
    font-size:24px;
    color:#00ffcc;
    margin-bottom:10px;
    font-weight:bold;
}

.ps-status{
    margin-bottom:10px;
    color:#cbd5e1;
}

.ps-timer{
    font-size:28px;
    font-weight:bold;
    color:#00ffcc;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="logo">OWNER DASHBOARD</div>
        <div class="sub">NGOPINGEGAME</div>
    </div>

    <button class="logout-btn" onclick="logout()">
        LOGOUT
    </button>

    <div class="grid">

        <div class="card">
            <div class="card-title">Total Transaksi</div>
            <div class="big-number" id="totalTransaksi">0</div>
        </div>

        <div class="card">
            <div class="card-title">Total Pendapatan</div>
            <div class="big-number" id="totalPendapatan">
                Rp 0
            </div>
        </div>

    </div>
<div class="table-card" style="margin-bottom:20px;">

    <div class="card-title">
        Monitoring Playstation
    </div>

    <div id="psOwner"></div>

</div>
    
    <div class="table-card">

        <div class="card-title">
            Riwayat Transaksi
        </div>

        <table>

            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Jam</th>
                    <th>Total</th>
                    <th>Waktu</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <tbody id="dataTransaksi">

            </tbody>

        </table>

        <button class="reset-btn" onclick="resetSemua()">
            RESET SEMUA TRANSAKSI
        </button>

    </div>

    <div class="footer">
        by asyraf
    </div>

</div>

<script type="module">
    
import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  remove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDtxgmyjXf-JTjpDNku_LZwO4GXniLvSVE",
  authDomain: "ngopingegame-3e92c.firebaseapp.com",
  databaseURL: "https://ngopingegame-3e92c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ngopingegame-3e92c",
  storageBucket: "ngopingegame-3e92c.firebasestorage.app",
  messagingSenderId: "810064465459",
  appId: "1:810064465459:web:b8564ed2898f41d24e5d46",
  measurementId: "G-Y8PSYJDYD4"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {

    if(!user){

        window.location.href = "login.html";

    }

});

window.logout = function(){

    signOut(auth)

    .then(() => {

        window.location.href = "login.html";

    })

}
    
const database = getDatabase(app);

window.hapusTransaksi = function(id){

    if(confirm('Hapus transaksi ini?')){

        remove(ref(database, 'transaksi/' + id));

    }

}

window.resetSemua = function(){

    if(confirm('Hapus semua transaksi?')){

        remove(ref(database, 'transaksi'));

    }

}

const transaksiRef = ref(database, 'transaksi');

onValue(transaksiRef, (snapshot) => {

    let data = snapshot.val();

    renderOwnerPS(data);
    
    let tabel = '';

    let jumlah = 0;

    let pendapatan = 0;

    if(data){

        for(let id in data){

            jumlah++;

            pendapatan += data[id].total;

            tabel += `
            <tr>
                <td>${data[id].nama}</td>
                <td>${data[id].jam} Jam</td>
                <td>Rp ${data[id].total.toLocaleString('id-ID')}</td>
                <td>${data[id].waktu}</td>

                <td>
                    <button onclick="hapusTransaksi('${id}')"
                    style="
                    background:#ef4444;
                    color:white;
                    border:none;
                    padding:8px 12px;
                    border-radius:8px;
                    cursor:pointer;
                    ">
                    Hapus
                    </button>
                </td>

            </tr>
            `;
        }

    }

    document.getElementById('dataTransaksi').innerHTML = tabel;

    document.getElementById('totalTransaksi').innerHTML =
    jumlah;

    document.getElementById('totalPendapatan').innerHTML =
    'Rp ' + pendapatan.toLocaleString('id-ID');

});
    function renderOwnerPS(data){

    let html = '';

    if(data){

        for(let id in data){

            let transaksi = data[id];

            let sisa = 0;

            if(transaksi.selesai){

                sisa = transaksi.selesai - Date.now();

            }

            let status = 'Kosong';

            let timer = '00:00:00';

            if(sisa > 0){

                status = 'Dipakai';

                let jam =
                Math.floor(sisa / 1000 / 60 / 60);

                let menit =
                Math.floor((sisa / 1000 / 60) % 60);

                let detik =
                Math.floor((sisa / 1000) % 60);

                timer =
                String(jam).padStart(2,'0') + ':' +
                String(menit).padStart(2,'0') + ':' +
                String(detik).padStart(2,'0');

            }else if(transaksi.selesai){

                status = 'WAKTU HABIS';

                timer = '00:00:00';

            }

            html += `
            <div class="ps-box">

                <div class="ps-title">
                    ${transaksi.ps}
                </div>

                <div class="ps-status">
                    ${status}
                </div>

                <div>
                    ${transaksi.nama}
                </div>

                <div class="ps-timer">
                    ${timer}
                </div>

            </div>
            `;

        }

    }

    document.getElementById('psOwner').innerHTML =
    html;

}
</script>

</body>
</html>
